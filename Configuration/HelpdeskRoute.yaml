routeEnhancers:
  TicketSystem:
    type: Extbase
    extension: NsHelpdesk
    # Registered plugin name in ext_localconf.php (tx_nshelpdesk_helpdesklist), NOT TypoScript alias tx_nshelpdesk_helpdesk
    plugin: HelpdeskList
    routes:
      - routePath: '/{ticket-sub}'
        _controller: 'Tickets::show'
        _arguments:
          ticket-sub: tickets
    defaultController: 'Tickets::list'
    aspects:
      ticket-sub:
        type: PersistedAliasMapper
        tableName: tx_nshelpdesk_domain_model_tickets
        routeFieldName: slug
