{namespace t3=NITSAN\NsHelpdesk\ViewHelpers\Typo3}
<table class="table table-striped table-hover typo3-extension-list no-footer">
    <thead>
      <tr>
        <th colspan="2">
          <f:translate
            key="nshelpdesk.plugin.title"
            extensionName="ns_helpdesk"
          /><br />
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>
          <f:translate
            key="nshelpdesk.plugin.display"
            extensionName="ns_helpdesk"
          />
        </th>
        <td>
          <f:translate
            key="nshelpdesk.plugin.display.type.list"
            extensionName="ns_helpdesk"
          />
        </td>
      </tr>
      <tr>
        <th>
          <f:translate
            key="nshelpdesk.plugin.list.listPageId"
            extensionName="ns_helpdesk"
          />
        </th>
        <td>
          <t3:majorVersion version="14" operator=">=">
            <f:then>{record.pi_flexform.sheets.sDEF.settings.listPageId}</f:then>
            <f:else>{pi_flexform_transformed.settings.listPageId}</f:else>
          </t3:majorVersion>
        </td>
      </tr>
      <tr>
        <th>
          <f:translate
            key="nshelpdesk.plugin.list.ticketCreatePage"
            extensionName="ns_helpdesk"
          />
        </th>
        <td>
          <t3:majorVersion version="14" operator=">=">
            <f:then>{record.pi_flexform.sheets.sDEF.settings.list.createPageId}</f:then>
            <f:else>{pi_flexform_transformed.settings.list.createPageId}</f:else>
          </t3:majorVersion>
        </td>
      </tr>
    </tbody>
  </table>
